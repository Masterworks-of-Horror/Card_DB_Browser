<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masters of Horror — Card Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <span class="logo">&#9764; Masters of Horror</span>
    <button id="refresh-btn" class="btn-refresh" title="Refresh data">&#8635; Sync</button>
  </header>

  <main>
    <div class="stats-bar" id="stats-bar"></div>

    <div class="charts">
      <div class="chart-box">
        <h3>Cost Curve</h3>
        <canvas id="chart-cost"></canvas>
      </div>
      <div class="chart-box">
        <h3>Rarity</h3>
        <canvas id="chart-rarity"></canvas>
      </div>
      <div class="chart-box">
        <h3>By Author</h3>
        <canvas id="chart-author"></canvas>
      </div>
      <div class="chart-box">
        <h3>Might vs Will</h3>
        <canvas id="chart-scatter"></canvas>
      </div>
    </div>

    <div class="table-controls">
      <input type="text" id="search" placeholder="Search cards..." class="search-input">
      <select id="filter-type" class="filter-select">
        <option value="">All Types</option>
      </select>
      <select id="filter-rarity" class="filter-select">
        <option value="">All Rarities</option>
      </select>
      <span id="count" class="count"></span>
    </div>

    <div class="table-wrap">
      <table id="card-table">
        <thead>
          <tr>
            <th data-sort="cardId">ID</th>
            <th data-sort="cardName">Name</th>
            <th data-sort="cardType">Type</th>
            <th data-sort="rarity">Rarity</th>
            <th data-sort="inspirationCost">Cost</th>
            <th data-sort="might">Might</th>
            <th data-sort="will">Will</th>
            <th>Effect</th>
          </tr>
        </thead>
        <tbody id="card-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
