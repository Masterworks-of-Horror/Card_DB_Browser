<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masters of Horror — Match Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <span class="logo">&#9764; Masters of Horror — Match Data</span>
    <button id="refresh-btn" class="btn-refresh">&#8635; Sync</button>
  </header>

  <main>
    <!-- Date Filter -->
    <div class="date-filter">
      <label>From</label>
      <input type="date" id="date-from" class="date-input">
      <label>To</label>
      <input type="date" id="date-to" class="date-input">
      <button id="date-clear" class="btn-refresh">Clear</button>
      <span id="match-count" class="count"></span>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar"></div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-box">
        <h3>Author Popularity</h3>
        <canvas id="chart-authors"></canvas>
      </div>
      <div class="chart-box">
        <h3>Most Played Cards</h3>
        <canvas id="chart-cards"></canvas>
      </div>
      <div class="chart-box">
        <h3>Page Changes by Reason</h3>
        <canvas id="chart-pages"></canvas>
      </div>
      <div class="chart-box">
        <h3>Card Plays per Act</h3>
        <canvas id="chart-acts"></canvas>
      </div>
    </div>

    <!-- Match Table -->
    <h2 class="section-title">Match Log</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Player</th>
            <th>Author</th>
            <th>Server</th>
            <th>Deck Size</th>
            <th>Cards Played</th>
            <th>Net Pages</th>
            <th>Acts Active</th>
          </tr>
        </thead>
        <tbody id="match-tbody"></tbody>
      </table>
    </div>

    <!-- Top Cards Table -->
    <h2 class="section-title">Card Play Frequency</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Card</th>
            <th>Type</th>
            <th>Rarity</th>
            <th>Cost</th>
            <th>Times Played</th>
            <th>% of Matches</th>
          </tr>
        </thead>
        <tbody id="card-freq-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
